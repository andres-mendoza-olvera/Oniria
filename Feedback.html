<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oniria - Red Social</title>
    <link rel="stylesheet" href="Feedback.css">
</head>
<body>

    <!-- Barra de navegación (FIJA) -->
    <header class="top-bar">
        <div class="menu-icon">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar short-bar"></div>
        </div>

        <!-- Nombre de la Red Social -->
        <h1 class="app-name">Oniria</h1>

        <div class="action-buttons" style="display: flex; align-items: center; gap: 15px;">
            <!-- Botón del tema -->
            <button id="theme-toggle" class="theme-btn" title="Cambiar tema">☀️</button>

            <!-- Foto de perfil (el script le pone el avatar según tu apodo) -->
            <div id="mi-avatar" class="circle profile-pic" title=""></div>

            <!-- Cerrar sesión -->
            <form action="/cerrar-sesion" method="POST" style="margin: 0;">
                <button type="submit" class="theme-btn" title="Cerrar sesión">🚪</button>
            </form>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="feed">

        <!-- Formulario para contar un sueño -->
        <article class="post-card create-post-card">
            <div class="post-header">
                <div class="avatar bg-blue" id="avatar-crear"></div>
                <h2>Cuenta tu sueño</h2>
            </div>
            <form id="form-crear" action="/crear-publicacion" method="POST" enctype="multipart/form-data" class="create-post-form">
                <textarea name="contenido" maxlength="2000" placeholder="¿Qué soñaste anoche? Cuéntalo con todos los detalles que recuerdes…" required></textarea>

                <div class="form-footer">
                    <label class="file-label">
                        📎 Agregar imagen (opcional)
                        <input type="file" name="imagen_post" accept="image/*" class="file-input">
                    </label>
                    <button type="submit" class="btn-publish">Publicar</button>
                </div>
                <p class="form-nota">✨ Oniria creará una imagen y una interpretación psicológica de tu sueño.</p>
            </form>
        </article>

        <!-- Aviso de sueños nuevos que llegan en tiempo real -->
        <button id="aviso-nuevos" class="aviso-nuevos" hidden></button>

        <!-- Aquí el script dibuja las publicaciones que vienen de la base de datos -->
        <section id="lista-publicaciones" class="lista-publicaciones" aria-live="polite"></section>

        <p id="estado-feed" class="feed-estado">Cargando sueños…</p>
        <button id="btn-cargar-mas" class="btn-cargar-mas" hidden>Ver más sueños</button>
    </main>

    <script src="Feedback-script.js"></script>
</body>
</html>
