<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Oniria</title>
    <meta name="description" content="Crea tu cuenta en Oniria y empieza a contar tus sueños, ilustrarlos con IA y compartirlos con tus amigos.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="LogIn.css">
    <script src="/Tema.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="app-name">Registro</h1>
            <p class="subtitle">Únete a Oniria</p>
            <form action="/registro" method="POST" class="login-form">
                <div class="input-group">
                    <input type="text" name="nombre" placeholder="Nombre completo" required>
                </div>
                <div class="input-group">
                <input type="text" name="apodo" placeholder="Apodo (sera público)" required>
                </div>
                <div class="input-group">
                    <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
                    <span id="error-email" class="error-text"></span>
                </div>
                <div class="input-group">
                    <div class="password-container">
                        <input type="password" id="password" name="password" placeholder="Contraseña" minlength="6" required data-fuerza>
                        <button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Mostrar contraseña">👁️</button>
                    </div>
                    <span id="error-password" class="error-text"></span>
                    <!-- Medidor de fuerza -->
                    <div class="fuerza-contrasena">
                        <div class="fuerza-barra"><div class="fuerza-relleno"></div></div>
                        <span class="fuerza-texto"></span>
                        <span class="fuerza-consejo"></span>
                    </div>
                </div>
                <!-- Aceptar las políticas (obligatorio). El enlace las abre en otra pestaña. -->
                <div class="input-group">
                    <label class="aceptar-politicas" for="politicas">
                        <input type="checkbox" id="politicas" name="acepto_politicas" value="1">
                        <span class="casilla" aria-hidden="true"></span>
                        <span>He leído y acepto los <a href="/privacidad?desde=registro" target="_blank" rel="noopener">Términos de uso y la Política de Privacidad</a> de Oniria, incluido el uso de mis sueños por la IA.</span>
                    </label>
                    <span id="error-politicas" class="error-text"></span>
                </div>

                <button type="submit" class="btn-primary">Registrarme</button>
            </form>
            <div class="login-footer">
                <a href="/" class="forgot-password">Ya tengo una cuenta</a>
            </div>
        </div>
    </div>
    <script src="/LogIn-script.js"></script>
    <script src="/FuerzaContrasena.js"></script>
    <script>
        // Sin aceptar las políticas no se manda el registro (el servidor también lo revisa)
        const casillaPoliticas = document.getElementById('politicas');
        const errorPoliticas = document.getElementById('error-politicas');
        document.querySelector('.login-form').addEventListener('submit', (e) => {
            if (casillaPoliticas.checked) return;
            e.preventDefault();
            errorPoliticas.textContent = 'Para crear tu cuenta necesitas aceptar los Términos y la Política de Privacidad.';
            errorPoliticas.style.display = 'block';
            casillaPoliticas.classList.add('input-error');
            casillaPoliticas.focus();
        });
        casillaPoliticas.addEventListener('change', () => {
            errorPoliticas.style.display = 'none';
            casillaPoliticas.classList.remove('input-error');
        });
    </script>
</body>
</html>
