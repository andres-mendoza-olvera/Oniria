<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis estadísticas - Oniria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Feedback.css">
    <link rel="stylesheet" href="/Graficas.css">
    <script src="/Tema.js"></script>
    <style>
        .estadisticas-pagina { padding: 32px 24px 48px; max-width: 960px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .estadisticas-encabezado { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .estadisticas-encabezado h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        .estadisticas-encabezado p { color: var(--text-muted); font-size: 0.92rem; margin-top: 4px; }
        .estadisticas-controles { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .selector-periodo {
            padding: 9px 12px; border-radius: 12px; border: 1px solid var(--border-color);
            background-color: var(--surface); color: var(--text-main); font: inherit; font-size: 0.88rem; font-weight: 600;
        }
        .btn-accion {
            display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 12px; border: none;
            background-color: var(--surface-2); color: var(--text-main); font: inherit; font-size: 0.88rem; font-weight: 600; cursor: pointer;
        }
        .btn-accion:hover { background-color: var(--surface-hover); }
        .btn-accion.principal { background: var(--gradiente); color: #fff; }
        .btn-accion:disabled { opacity: 0.6; cursor: default; }
        .estado-carga { color: var(--text-muted); text-align: center; padding: 40px 0; }
        /* Clima onírico: lo que soñó toda la comunidad esta semana (anónimo) */
        .clima {
            position: relative; overflow: hidden; border-radius: 20px; padding: 20px 22px;
            background: var(--gradiente); color: #fff; box-shadow: 0 10px 30px rgba(124, 77, 219, 0.25);
        }
        .clima::after {
            content: ''; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.12); pointer-events: none;
        }
        .clima-etiqueta { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; opacity: 0.9; }
        .clima-frase { margin-top: 8px; font-size: 1.15rem; font-weight: 700; line-height: 1.4; max-width: 640px; }
        .clima-detalle { margin-top: 8px; font-size: 0.86rem; opacity: 0.92; }
        .clima-nota { margin-top: 10px; font-size: 0.74rem; opacity: 0.75; }
        .clima a { color: #fff; font-weight: 700; }
        @media (max-width: 640px) {
            .estadisticas-pagina { padding: calc(var(--alto-top) + 16px) 12px calc(90px + env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>

    <!-- Barra superior (solo en celular) -->
    <header class="top-bar">
        <a href="/feed" class="app-name">Oniria</a>
        <div class="top-bar-acciones">
            <button type="button" class="icon-btn js-tema" title="Cambiar tema" aria-label="Cambiar tema"></button>
            <form action="/cerrar-sesion" method="POST">
                <button type="submit" class="icon-btn" aria-label="Cerrar sesión" title="Cerrar sesión"><span class="icono" data-icono="salir"></span></button>
            </form>
        </div>
    </header>

    <div class="app sin-derecha">
        <aside class="sidebar">
            <a href="/feed" class="app-name sidebar-logo">Oniria</a>
            <nav class="menu">
                <a href="/feed" class="menu-item"><span class="icono" data-icono="inicio"></span><span>Inicio</span></a>
                <a href="/sueno" class="menu-item"><span class="icono" data-icono="mas"></span><span>Contar un sueño</span></a>
                <a href="/perfil#buscar" class="menu-item"><span class="icono" data-icono="buscar"></span><span>Buscar amigos</span></a>
                <a href="/perfil" class="menu-item">
                    <span class="menu-icono-globo"><span class="avatar avatar-xs js-mi-avatar"></span><span class="globo js-solicitudes" hidden></span></span><span>Mi perfil</span>
                </a>
                <a href="/estadisticas" class="menu-item activo"><span class="icono" data-icono="grafica"></span><span>Mis estadísticas</span></a>
                <button type="button" class="menu-item js-tema">
                    <span class="icono" data-icono="luna"></span><span class="js-tema-texto">Tema oscuro</span>
                </button>
                <a href="/privacidad" class="menu-item"><span class="icono" data-icono="escudo"></span><span>Privacidad</span></a>
            </nav>
            <form action="/cerrar-sesion" method="POST" class="menu-salir">
                <button type="submit" class="menu-item"><span class="icono" data-icono="salir"></span><span>Cerrar sesión</span></button>
            </form>
        </aside>

        <main class="estadisticas-pagina">
            <div class="estadisticas-encabezado">
                <div>
                    <h1>Mis estadísticas</h1>
                    <p>Así se ven tus sueños. Descarga la imagen o compártela.</p>
                </div>
                <div class="estadisticas-controles">
                    <select id="periodo" class="selector-periodo" aria-label="Periodo">
                        <option value="">Desde siempre</option>
                        <option value="365">Último año</option>
                        <option value="90">Últimos 90 días</option>
                        <option value="30">Últimos 30 días</option>
                        <option value="7">Última semana</option>
                    </select>
                    <button type="button" id="btn-descargar" class="btn-accion"><span class="icono icono-sm" data-icono="descargar"></span>Descargar</button>
                    <button type="button" id="btn-compartir" class="btn-accion principal"><span class="icono icono-sm" data-icono="compartir"></span>Compartir</button>
                </div>
            </div>

            <section id="clima" class="clima" aria-live="polite" hidden></section>

            <p id="estado" class="estado-carga">Calculando tus estadísticas…</p>
            <section id="numeros" class="numeros" aria-label="Resumen" hidden></section>
            <section id="graficas" class="graficas" hidden></section>
        </main>
    </div>

    <nav class="bottom-nav" aria-label="Navegación">
        <a href="/feed" class="bottom-nav-item" aria-label="Inicio"><span class="icono" data-icono="inicio"></span></a>
        <a href="/sueno" class="bottom-nav-item" aria-label="Contar un sueño"><span class="icono icono-mas" data-icono="mas-simple"></span></a>
        <a href="/estadisticas" class="bottom-nav-item" aria-label="Mis estadísticas"><span class="icono" data-icono="grafica"></span></a>
        <a href="/perfil" class="bottom-nav-item" aria-label="Mi perfil">
            <span class="menu-icono-globo"><span class="avatar avatar-xs js-mi-avatar"></span><span class="globo js-solicitudes" hidden></span></span>
        </a>
    </nav>

    <script src="/Comun.js"></script>
    <script src="/Graficas.js"></script>
    <script src="/Estadisticas-script.js"></script>
</body>
</html>
