<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código de acceso - Oniria</title>
    <meta name="description" content="Escribe el código de 6 dígitos que te enviamos para terminar de iniciar sesión en Oniria.">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/LogIn.css">
    <link rel="stylesheet" href="/OlvideContrasena.css">
    <link rel="stylesheet" href="/VerificarAcceso.css">
    <script src="/Tema.js"></script>
</head>
<body>

    <!-- Paso 2 de 2 del inicio de sesión: escribir el código que llegó por correo o SMS -->
    <div class="login-container">
        <div class="login-box">

            <div class="recover-icon" aria-hidden="true">🔐</div>
            <h1 class="app-name recover-title">Revisa tu <span id="titulo-medio">correo</span></h1>
            <p class="recover-instructions" id="instrucciones">Te estamos mandando un código de 6 dígitos…</p>

            <form id="form-codigo" class="login-form" novalidate>
                <div class="input-group">
                    <input type="text" id="codigo" class="codigo-acceso" inputmode="numeric" autocomplete="one-time-code"
                           maxlength="6" placeholder="••••••" aria-label="Código de 6 dígitos" required>
                    <span id="error-codigo" class="error-text" role="alert"></span>
                </div>
                <button type="submit" id="btn-verificar" class="btn-primary">Entrar</button>
            </form>

            <div id="aviso-spam" class="aviso-spam" hidden>
                <svg class="aviso-spam-img" viewBox="0 0 220 120" role="img" aria-label="Un sobre con el código dentro de la carpeta de correo no deseado">
                    <rect x="8" y="22" width="86" height="76" rx="10" class="sp-carpeta"/>
                    <path d="M8 36 H94" class="sp-linea"/>
                    <text x="51" y="32" class="sp-etq" text-anchor="middle">Spam</text>
                    <rect x="22" y="48" width="58" height="38" rx="6" class="sp-sobre"/>
                    <path d="M22 52 L51 72 L80 52" class="sp-solapa"/>
                    <path d="M104 60 H138" class="sp-flecha"/>
                    <path d="M130 52 L140 60 L130 68" class="sp-flecha"/>
                    <rect x="150" y="30" width="62" height="60" rx="10" class="sp-bandeja"/>
                    <path d="M150 52 H212" class="sp-linea"/>
                    <text x="181" y="44" class="sp-etq" text-anchor="middle">Entrada</text>
                    <path d="M166 74 l9 9 l17 -19" class="sp-palomita"/>
                </svg>
                <p><strong>¿No te llegó?</strong> Revisa la carpeta de <strong>spam</strong> o <strong>correo no deseado</strong>. Si lo encuentras ahí, márcalo como "No es spam" para recibir los siguientes en tu bandeja de entrada.</p>
            </div>

            <div id="aviso" class="success-message" role="status"></div>

            <div class="acceso-opciones">
                <button type="button" id="btn-reenviar" class="enlace-acceso">Reenviar código</button>
                <button type="button" id="btn-otro-metodo" class="enlace-acceso" hidden></button>
            </div>

            <div class="login-footer">
                <hr class="divider">
                <a href="/" class="back-link">← Volver a iniciar sesión</a>
            </div>

        </div>
    </div>

    <script src="/VerificarAcceso-script.js"></script>
</body>
</html>
